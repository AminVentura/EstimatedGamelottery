# CI estándar de Businessskore (plantilla 2026-10-19, C:\Proyectos\_recursos\plantilla-ci): Construir -> Probar.
# GameLottery: PrediccionLoteria/functions instala con --legacy-peer-deps porque firebase-functions 4.9 no declara compatibilidad con firebase-admin 13 (hallazgo real: actualizar firebase-functions).
# Corre en cada push y en cada pull request. El deploy (deploy.yml) solo arranca
# cuando este workflow termina en verde en la rama de producción.
# Check que hay que exigir en la protección de rama: "CI / ci-ok".
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paquete:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Una entrada por carpeta con package.json + package-lock.json.
          #   dir:      carpeta (". " para la raíz)
          #   node:     versión de Node (la de "engines" o la del hosting)
          #   scripts:  scripts de package.json, en orden (lint, typecheck, test, build...);
          #             "ws:build" = npm run build en todos los workspaces que lo tengan
          #             "test@--passWithNoTests" = npm run test -- --passWithNoTests
          #   npmflags: opciones extra de npm ci (p. ej. --legacy-peer-deps), vacío por defecto
          #   emulador: 'firestore' si los tests usan el emulador de Firestore
          - dir: .
            node: '22'
            scripts:
            emulador: ''
            npmflags: ''
          - dir: PrediccionLoteria/functions
            node: '20'
            scripts:
            emulador: ''
            npmflags: '--legacy-peer-deps'
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package*.json

      - name: Instalar (npm ci)
        id: instalar
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund ${{ matrix.npmflags }}
          else
            echo "::warning title=Sin package-lock.json::${{ matrix.dir }} no tiene lockfile; se usa npm install (instalación no reproducible). Versionar package-lock.json."
            npm install --no-audit --no-fund ${{ matrix.npmflags }}
          fi

      - name: Java para el emulador de Firestore
        if: matrix.emulador != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Lint, typecheck, tests y build
        shell: bash
        run: |
          set +e -uo pipefail   # seguir con los demás scripts aunque uno falle
          fallos=""
          for s in ${{ matrix.scripts }}; do
            nombre="${s%%@*}"; args=""
            if [ "$nombre" != "$s" ]; then args="-- ${s#*@}"; fi
            echo "::group::npm run $nombre $args"
            if [ "${nombre#ws:}" != "$nombre" ]; then
              npm run "${nombre#ws:}" --workspaces --if-present $args
            elif [ -n "${{ matrix.emulador }}" ] && [ "$nombre" = "test" ]; then
              npx --yes firebase-tools@15.34.0 emulators:exec --only ${{ matrix.emulador }} --project demo-ci "npm run test $args"
            else
              npm run "$nombre" $args
            fi
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then echo "::error title=Falló npm run $nombre::${{ matrix.dir }}: exit $rc"; fallos="$fallos $nombre"; fi
          done
          if [ -n "$fallos" ]; then echo "Fallaron:$fallos"; exit 1; fi

      - name: Licencias (prohibido GPL/AGPL)
        # Corre aunque falle un paso anterior, para ver todos los hallazgos en un solo run.
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/licencias.mjs" .

      - name: npm audit (críticas)
        # Corre aunque falle un paso anterior, para ver todos los hallazgos en un solo run.
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then npm i --package-lock-only --no-audit --no-fund >/dev/null; fi
          npm audit --audit-level=critical

  ci-ok:
    # Un solo check para la protección de rama, aunque cambie la matriz.
    name: ci-ok
    if: always()
    needs: [paquete]
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        run: |
          if [ "${{ needs.paquete.result }}" != "success" ]; then
            echo "Algún paquete falló: ${{ needs.paquete.result }}"; exit 1
          fi
          echo "CI verde"
